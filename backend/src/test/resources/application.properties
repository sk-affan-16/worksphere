
# Isolated in-memory database for automated tests
spring.datasource.url=jdbc:h2:mem:worksphere_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Recreate the test schema for each test application context
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Test-only JWT signing key; never use in production
security.jwt.secret=VGVzdE9ubHlXb3Jrc3BoZXJlS2V5MTIzNDU2Nzg5MDEyMzQ1Ng==
security.jwt.expiration-ms=900000
