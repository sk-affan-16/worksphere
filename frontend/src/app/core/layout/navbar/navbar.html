<header class="navbar">
  <div class="page-info">
    <h2>{{ pageTitle }}</h2>
    <span>Workforce Management Platform</span>
  </div>

  <div class="navbar-actions">
    <button
      class="icon-button"
      type="button"
      aria-label="Notifications"
      (click)="openNotifications()"
    >
      <span aria-hidden="true">🔔</span>
    </button>

    <div class="avatar" aria-hidden="true">
      @if (profilePhotoUrl) {
        <img
          [src]="profilePhotoUrl"
          alt="Profile photo"
        />
      } @else {
        <span>{{ avatarInitial }}</span>
      }
    </div>

    <div class="user-info">
      <strong>{{ displayName }}</strong>
      <span>{{ displayRole }}</span>
    </div>

    <button
      class="logout-button"
      type="button"
      (click)="logout()"
    >
      Logout
    </button>
  </div>
</header>
