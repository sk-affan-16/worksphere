<header class="navbar">
  <div class="page-info">
    <h2>{{ pageTitle }}</h2>
    <span>Workforce Management Platform</span>
  </div>

  <div class="navbar-actions">
    <button
      class="icon-button"
      type="button"
      aria-label="Notifications"
      (click)="openNotifications()"
    >
      🔔
    </button>

    <div class="user-profile">
      <div class="avatar">R</div>

      <div class="user-info">
        <strong>Rabin</strong>
        <span>Administrator</span>
      </div>

      <button
        class="logout-button"
        type="button"
        (click)="logout()"
      >
        Logout
      </button>
    </div>
  </div>
</header>
